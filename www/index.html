<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Venceti Mods</title>
<style>
* { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
body {
    background:#0b0b0b;
    color:#e0e0e0;
    font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    padding:24px;
    -webkit-font-smoothing:antialiased;
}
.wrap { width:100%; max-width:420px; text-align:center; user-select:none; }
h1 { font-weight:400; font-size:1.9rem; letter-spacing:1px; color:#b0b0b0; margin-bottom:.25rem; }
.sub { font-size:.95rem; color:#7a7a7a; margin-bottom:2.5rem; }
.options { display:flex; flex-direction:column; gap:14px; width:100%; }
.option {
    display:flex; align-items:center; justify-content:space-between;
    gap:12px; background:#141414; border:1px solid #232323;
    border-radius:12px; padding:14px 18px; cursor:pointer;
    transition:background .2s, border-color .2s, transform .15s;
}
.option:active { transform:scale(.985); }
.option.selected { border-color:#2f80ff; background:#101a2e; }
.option-left { display:flex; align-items:center; gap:14px; }
.option-icon { width:34px; height:34px; color:#cfcfcf; }
.option-icon svg { width:100%; height:100%; display:block; }
.option-label { font-size:1rem; font-weight:500; color:#dcdcdc; }
.option.selected .option-label { color:#fff; }
.option-sub { font-size:.78rem; color:#6c6c6c; margin-top:1px; }
.indicator {
    width:22px; height:22px; border-radius:50%;
    border:2px solid #3a3a3a; position:relative; flex-shrink:0;
    transition:border-color .2s, box-shadow .2s;
}
.indicator::after {
    content:''; position:absolute; top:50%; left:50%;
    width:10px; height:10px; border-radius:50%; background:#2f80ff;
    transform:translate(-50%,-50%) scale(0); transition:transform .18s;
}
.option.selected .indicator { border-color:#2f80ff; box-shadow:0 0 10px rgba(47,128,255,.55); }
.option.selected .indicator::after { transform:translate(-50%,-50%) scale(1); }

.status-panel {
    margin-top:2rem; background:#101010; border:1px solid #1f1f1f;
    border-radius:12px; padding:14px 18px; text-align:left;
}
.status-title {
    font-size:.72rem; letter-spacing:1.5px; text-transform:uppercase;
    color:#565656; margin-bottom:12px; font-weight:600;
}
.status-row {
    display:flex; justify-content:space-between; align-items:center;
    padding:8px 0; border-bottom:1px solid #1a1a1a;
}
.status-row:last-child { border-bottom:none; padding-bottom:0; }
.status-row:first-of-type { padding-top:0; }
.status-name { font-size:.9rem; color:#c8c8c8; font-weight:500; }
.status-value {
    display:inline-flex; align-items:center; gap:7px; font-size:.82rem;
    font-weight:500; padding:3px 10px; border-radius:999px;
    background:#181818; border:1px solid #262626; color:#9a9a9a;
}
.status-dot { width:8px; height:8px; border-radius:50%; background:#4a4a4a; }
.status-value.work .status-dot { background:#2ecc71; box-shadow:0 0 8px rgba(46,204,113,.7); }
.status-value.work { color:#7ee2a8; border-color:#1f3a2a; background:#0f1a14; }

.start-btn {
    margin-top:1.5rem; width:100%;
    background:#161616; border:1px solid #262626; border-radius:12px;
    padding:16px 20px; color:#d0d0d0;
    font-size:1rem; font-weight:600; font-family:inherit;
    letter-spacing:.5px; cursor:pointer;
    display:flex; align-items:center; justify-content:center; gap:10px;
    transition:background .2s, border-color .2s, transform .15s, opacity .2s;
}
.start-btn:not(:disabled):active { transform:scale(.985); }
.start-btn:disabled { opacity:.4; cursor:not-allowed; }
.start-btn.ready { border-color:#2f80ff; background:#0a1424; color:#fff; }
.start-badge {
    width:26px; height:26px; border-radius:50%;
    background:#000; border:1px solid #2a2a2a;
    display:flex; align-items:center; justify-content:center;
    font-size:.78rem; font-weight:700; color:#2f80ff; text-transform:uppercase;
}
.start-btn.ready .start-badge { border-color:#2f80ff; box-shadow:0 0 8px rgba(47,128,255,.5); }

.footer { margin-top:2rem; font-size:.85rem; color:#3a3a3a; }
</style>
</head>
<body>
<div class="wrap">
    <h1>Venceti Mods</h1>
    <p class="sub">choose your game version</p>

    <div class="options" id="options">
        <div class="option" data-value="apk" tabindex="0">
            <div class="option-left">
                <div class="option-icon">
                    <svg viewBox="0 0 24 24" fill="currentColor">
                        <path d="M17.523 15.341a6.247 6.247 0 0 0-1.153-3.315l1.305-2.26a.4.4 0 0 0-.146-.546.4.4 0 0 0-.546.146l-1.29 2.234a6.222 6.222 0 0 0-3.195-.877 6.222 6.222 0 0 0-3.195.877L8.013 9.366a.4.4 0 0 0-.546-.146.4.4 0 0 0-.146.546l1.305 2.26a6.247 6.247 0 0 0-1.153 3.315c0 .55.447.998.998.998h7.054a.998.998 0 0 0 .998-.998zM9.5 13.5a.75.75 0 1 1 0-1.5.75.75 0 0 1 0 1.5zm5 0a.75.75 0 1 1 0-1.5.75.75 0 0 1 0 1.5z"/>
                    </svg>
                </div>
                <div>
                    <div class="option-label">APK</div>
                    <div class="option-sub">com.grand.cr</div>
                </div>
            </div>
            <div class="indicator"></div>
        </div>

        <div class="option" data-value="google-play" tabindex="0">
            <div class="option-left">
                <div class="option-icon">
                    <svg viewBox="0 0 24 24" fill="currentColor">
                        <path d="M3.609 1.814 13.792 12 3.61 22.186a1.5 1.5 0 0 1-.61-1.2V3.014a1.5 1.5 0 0 1 .609-1.2zm11.71 11.71 2.61 2.61-2.61 2.61-2.61-2.61 2.61-2.61zm0-3.048L12.71 7.867l-2.61-2.61 2.61-2.61 2.61 2.61-2.61 2.61 2.61 2.61zM20.39 12l-2.39 2.39-2.39-2.39 2.39-2.39L20.39 12z"/>
                    </svg>
                </div>
                <div>
                    <div class="option-label">Google Play</div>
                    <div class="option-sub">com.grand.launcher</div>
                </div>
            </div>
            <div class="indicator"></div>
        </div>
    </div>

    <div class="status-panel">
        <div class="status-title">Status</div>
        <div class="status-row">
            <span class="status-name">Shizuku</span>
            <span class="status-value" id="shizukuStatus"><span class="status-dot"></span><span>Not</span></span>
        </div>
        <div class="status-row">
            <span class="status-name">Overlay</span>
            <span class="status-value" id="overlayStatus"><span class="status-dot"></span><span>Not</span></span>
        </div>
    </div>

    <button class="start-btn" id="startBtn" disabled>
        <span class="start-badge" id="startBadge">—</span>
        <span>Start Mods</span>
    </button>

    <div class="footer">✦</div>
</div>

<script>
(function(){
    const Native = {
        available: typeof window.VencetiAndroid !== 'undefined',
        isShizukuRunning: () => Native.available && window.VencetiAndroid.isShizukuRunning(),
        hasShizukuPermission: () => Native.available && window.VencetiAndroid.hasShizukuPermission(),
        requestShizukuPermission: () => Native.available && window.VencetiAndroid.requestShizukuPermission(),
        hasOverlayPermission: () => Native.available && window.VencetiAndroid.hasOverlayPermission(),
        requestOverlayPermission: () => Native.available && window.VencetiAndroid.requestOverlayPermission(),
        startFloatingBubble: (mode) => Native.available && window.VencetiAndroid.startFloatingBubble(mode)
    };

    let selected = null;
    const options = document.querySelectorAll('.option');
    const startBtn = document.getElementById('startBtn');
    const startBadge = document.getElementById('startBadge');
    const shizukuStatus = document.getElementById('shizukuStatus');
    const overlayStatus = document.getElementById('overlayStatus');

    function setStatus(el, ok) {
        el.classList.toggle('work', ok);
        el.querySelector('span:last-child').textContent = ok ? 'Work' : 'Not';
    }

    function refreshStatuses() {
        const sh = Native.isShizukuRunning() && Native.hasShizukuPermission();
        const ov = Native.hasOverlayPermission();
        setStatus(shizukuStatus, sh);
        setStatus(overlayStatus, ov);
        updateStartButton();
    }

    function updateStartButton() {
        if (!selected) {
            startBtn.disabled = true;
            startBtn.classList.remove('ready');
            startBadge.textContent = '—';
            return;
        }
        startBadge.textContent = selected === 'apk' ? 'a' : 'g';
        startBtn.classList.add('ready');
        startBtn.disabled = false;
    }

    options.forEach(opt => {
        opt.addEventListener('click', () => {
            options.forEach(o => o.classList.remove('selected'));
            opt.classList.add('selected');
            selected = opt.dataset.value;
            updateStartButton();
        });
    });

    startBtn.addEventListener('click', () => {
        if (!selected) return;

        if (!Native.isShizukuRunning() || !Native.hasShizukuPermission()) {
            Native.requestShizukuPermission();
            return;
        }

        if (!Native.hasOverlayPermission()) {
            Native.requestOverlayPermission();
            return;
        }

        Native.startFloatingBubble(selected);
    });

    document.addEventListener('visibilitychange', () => {
        if (!document.hidden) refreshStatuses();
    });
    window.addEventListener('focus', refreshStatuses);

    refreshStatuses();
    setInterval(refreshStatuses, 1500);
})();
</script>
</body>
</html>
