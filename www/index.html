<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Venceti Mods</title>
<style>
  :root{--bg:#0E0E10;--btn:#16161A;--acc:#2F80FF;--txt:#DCDCDC;--mut:#6C6C6C;--line:#26262C}
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
  html,body{margin:0;background:var(--bg);color:var(--txt);font-family:-apple-system,Roboto,"Segoe UI",sans-serif}
  body{min-height:100vh;padding:calc(env(safe-area-inset-top,0px) + 36px) 20px calc(env(safe-area-inset-bottom,0px) + 28px)}
  .wrap{max-width:420px;margin:0 auto}
  h1{margin:0;font-size:28px;font-weight:700;letter-spacing:.3px}
  .sub{margin:6px 0 26px;color:var(--mut);font-size:14px}
  .opt{width:100%;display:flex;align-items:center;gap:14px;padding:16px;margin-bottom:10px;background:var(--btn);
       border:1px solid var(--line);border-radius:14px;color:var(--txt);font-size:16px;text-align:left;font-family:inherit;transition:border-color .15s}
  .opt svg{width:26px;height:26px;flex:none}
  .opt .name{flex:1}
  .radio{width:20px;height:20px;border-radius:50%;border:2px solid var(--mut);position:relative;flex:none;transition:border-color .15s}
  .opt.sel{border-color:var(--acc)}
  .opt.sel .radio{border-color:var(--acc)}
  .opt.sel .radio::after{content:"";position:absolute;inset:3px;border-radius:50%;background:var(--acc)}
  .label{margin:26px 0 10px;color:var(--mut);font-size:12px;letter-spacing:1.5px}
  .status{background:var(--btn);border:1px solid var(--line);border-radius:14px;padding:4px 16px}
  .row{display:flex;justify-content:space-between;padding:12px 0;font-size:15px}
  .row+.row{border-top:1px solid var(--line)}
  .ok{color:var(--acc)} .no{color:var(--mut)}
  .btn{width:100%;display:flex;align-items:center;justify-content:center;gap:10px;padding:15px;border-radius:14px;
       border:1px solid var(--line);background:var(--btn);color:var(--txt);font-size:16px;font-family:inherit;margin-top:10px;transition:opacity .15s}
  .btn svg{width:20px;height:20px}
  .btn:active{opacity:.6}
  .main{background:var(--acc);border-color:var(--acc);color:#fff;font-weight:600;margin-top:22px}
  .main:disabled{background:var(--btn);border-color:var(--line);color:var(--mut)}
  .hint{min-height:20px;margin-top:10px;text-align:center;color:var(--mut);font-size:13px}
  .modal{position:fixed;inset:0;background:rgba(0,0,0,.65);display:none;align-items:center;justify-content:center;padding:24px;z-index:10}
  .modal.show{display:flex}
  .card{width:100%;max-width:340px;background:var(--bg);border:1px solid var(--line);border-radius:16px;padding:18px}
  .card h2{margin:0 0 6px;font-size:18px}
  .card .btn:first-of-type{margin-top:14px}
</style>
</head>
<body>
<div class="wrap">
  <h1>Venceti Mods</h1>
  <p class="sub">choose your game version</p>

  <button class="opt" id="opt-apk" data-mode="apk">
    <svg viewBox="0 0 24 24" fill="none" stroke="#2F80FF" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
      <path d="M6 10a6 6 0 0 1 12 0z"/>
      <rect x="6" y="11.5" width="12" height="7" rx="1.5"/>
      <path d="M8.5 5.2L7.5 3.6M15.5 5.2L16.5 3.6M3.5 12.5v4M20.5 12.5v4M9.5 18.5v2.5M14.5 18.5v2.5"/>
      <circle cx="9.5" cy="7.5" r=".5" fill="#2F80FF"/><circle cx="14.5" cy="7.5" r=".5" fill="#2F80FF"/>
    </svg>
    <span class="name">APK</span><span class="radio"></span>
  </button>

  <button class="opt" id="opt-play" data-mode="play">
    <svg viewBox="0 0 24 24" fill="none" stroke="#2F80FF" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
      <path d="M6 3.8v16.4a.8.8 0 0 0 1.2.7l13-8.2a.8.8 0 0 0 0-1.4L7.2 3.1A.8.8 0 0 0 6 3.8z"/>
      <path d="M6.2 3.7L14.3 12 6.2 20.3"/>
    </svg>
    <span class="name">Google Play</span><span class="radio"></span>
  </button>

  <div class="label">STATUS</div>
  <div class="status">
    <div class="row"><span>Shizuku</span><span id="st-shizuku" class="no">Not</span></div>
    <div class="row"><span>Overlay</span><span id="st-overlay" class="no">Not</span></div>
  </div>

  <button class="btn main" id="start" disabled>Start Mods</button>
  <div class="hint" id="hint"></div>

  <button class="btn" id="tg">
    <svg viewBox="0 0 24 24" fill="none" stroke="#2F80FF" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M21 3L3 10.5l6.5 2.5L12 20l3-4.5L20 20z"/><path d="M9.5 13L21 3"/></svg>
    Telegram Creator
  </button>
  <button class="btn" id="info">
    <svg viewBox="0 0 24 24" fill="none" stroke="#2F80FF" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 11v6"/><circle cx="12" cy="7.6" r=".6" fill="#2F80FF"/></svg>
    Information
  </button>
</div>

<div class="modal" id="modal">
  <div class="card">
    <h2>Information</h2>
    <button class="btn" id="m-ch">Telegram Channel</button>
    <button class="btn" id="m-dm">Telegram (DM)</button>
    <button class="btn" id="m-close">Close</button>
  </div>
</div>

<script>
(function(){
  var URL_CREATOR='https://t.me/babycores', URL_CHANNEL='https://t.me/funky_sb';
  var mode=null, hintTimer=null;
  function $(id){return document.getElementById(id);}

  function A(fn){
    try{
      var b=window.VencetiAndroid;
      if(b && typeof b[fn]==='function'){
        var args=Array.prototype.slice.call(arguments,1);
        return b[fn].apply(b,args);
      }
    }catch(e){}
    return undefined;
  }

  function hint(t){
    $('hint').textContent=t;
    clearTimeout(hintTimer);
    hintTimer=setTimeout(function(){$('hint').textContent='';},3500);
  }

  function setStat(id,ok){
    var el=$(id);
    el.textContent=ok?'Work':'Not';
    el.className=ok?'ok':'no';
  }

  function refresh(){
    var sh=A('isShizukuRunning')===true && A('hasShizukuPermission')===true;
    var ov=A('hasOverlayPermission')===true;
    setStat('st-shizuku',sh);
    setStat('st-overlay',ov);
  }

  function select(m){
    mode=m;
    $('opt-apk').classList.toggle('sel',m==='apk');
    $('opt-play').classList.toggle('sel',m==='play');
    $('start').disabled=!mode;
    try{localStorage.setItem('vm_mode',m);}catch(e){}
  }

  function openTG(url){
    if(window.VencetiAndroid && typeof window.VencetiAndroid.openTelegram==='function'){A('openTelegram',url);}
    else{window.open(url,'_blank');}
  }

  $('opt-apk').onclick=function(){select('apk');};
  $('opt-play').onclick=function(){select('play');};

  $('start').onclick=function(){
    if(!mode) return;
    if(A('isShizukuRunning')!==true){hint('Shizuku is not running');return;}
    if(A('hasShizukuPermission')!==true){A('requestShizukuPermission');hint('Allow Shizuku access');return;}
    if(A('hasOverlayPermission')!==true){A('requestOverlayPermission');hint('Allow overlay permission');return;}
    A('startFloatingBubble',mode);
  };

  $('tg').onclick=function(){openTG(URL_CREATOR);};
  $('info').onclick=function(){$('modal').classList.add('show');};
  $('m-close').onclick=function(){$('modal').classList.remove('show');};
  $('modal').onclick=function(e){if(e.target===this)this.classList.remove('show');};
  $('m-ch').onclick=function(){openTG(URL_CHANNEL);};
  $('m-dm').onclick=function(){openTG(URL_CREATOR);};

  try{var saved=localStorage.getItem('vm_mode'); if(saved==='apk'||saved==='play') select(saved);}catch(e){}
  refresh();
  setInterval(refresh,1500);
  document.addEventListener('visibilitychange',refresh);
})();
</script>
</body>
</html>
